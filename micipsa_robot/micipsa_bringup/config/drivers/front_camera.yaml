# THE YAML SHOULD NOT BE A ROS2 PARAM YAML FILE, 
# REALSENSE2 CREATE THE ROS2 PARAMS FROM THEY YAML FILE INSIDE THE LAUNCH FILE
#Global
serial_no: ""
usb_port_id: ""
device_type: ""
config_file: ""
json_file_path: ""
wait_for_device_timeout: -1.
reconnect_timeout: 6.
accelerate_gpu_with_glsl: false
clip_distance: 5.
colorizer.enable: false
decimation_filter.enable: true
decimation_filter.filter_magnitude: 7

spatial_filter.enable: false
temporal_filter.enable: false
disparity_filter.enable: false
hole_filling_filter.enable: false
hdr_merge.enable: false
initial_reset: false

#DEBUG
diagnostics_period: 0.0
rosbag_filename: ""
log_level: info
output: screen

#TF
publish_tf: false
tf_publish_rate: 1.0

#RGB
rgb_camera.color_profile: 640x480x15
rgb_camera.color_format: RGB8
rgb_camera.enable_auto_exposure: true
enable_rgbd: false
enable_color: true
enable_sync: true

#INFRA
enable_infra: false
enable_infra1: false
enable_infra2: false

#PC
enable_depth: true
align_depth.enable: true
pointcloud.enable: true
pointcloud.ordered_pc: true
pointcloud.stream_filter: 2
pointcloud.stream_index_filter: 0
pointcloud.allow_no_texture_points: false
pointcloud.pointcloud_qos: SENSOR_DATA

#IMU
enable_gyro: false
enable_accel: false
# 0: no imu topic
# 1-copy: Every gyro message will be attached by the last accel message. 
# 2-linear_interpolation: Every gyro message will be attached by an accel message which is interpolated to gyro's timestamp
unite_imu_method: 1
gyro_fps: 200
accel_fps: 250
angular_velocity_cov: 0.01
linear_accel_cov: 0.01

#DEPTH
depth_module.depth_profile: 640x480x15
depth_module.depth_format: Z16
depth_module.infra_profile: 640x480x15
depth_module.infra_format: RGB8
depth_module.infra1_format: Y8
depth_module.infra2_format: Y8
depth_module.exposure: 8500
depth_module.gain: 16
depth_module.hdr_enabled: false
depth_module.enable_auto_exposure: true
depth_module.exposure.1: 7500
depth_module.gain.1: 16 
depth_module.exposure.2: 1
depth_module.gain.2: 16

