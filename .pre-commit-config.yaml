#-------------------------------
# Excluding Third Party Packages
#-------------------------------
exclude: ^(third_party/)

repos:
  #-------
  # Python
  #-------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright
        additional_dependencies:
          - pytest
          - pyyaml
          - setuptools
    #--------
    # C / C++
    #--------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c,c++]
        args: ["-style=file"]